spring:
  application:
    name: agentic-commerce-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/agentic_commerce}
    username: ${DB_USERNAME:agentic}
    password: ${DB_PASSWORD:agentic_local}
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: ${SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
  task:
    scheduling:
      pool:
        size: 2

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  servlet:
    session:
      cookie:
        name: ACG_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
