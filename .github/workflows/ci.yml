name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Set up Node 24.19 for evidence validation
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Validate labelled evaluation datasets
        working-directory: ${{ github.workspace }}
        run: node scripts/evidence.mjs validate
      - name: Verify backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify
      - name: Assemble offline evidence index
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/run-evidence.mjs attacks-record
          node scripts/evidence.mjs index --require-offline

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24.19
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm web:lint
      - name: Typecheck
        run: pnpm web:typecheck
      - name: Test
        run: pnpm web:test
      - name: Build
        run: pnpm web:build
